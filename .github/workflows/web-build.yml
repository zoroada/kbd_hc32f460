name: Web firmware build
run-name: Web build ${{ inputs.owner_tag || 'cleanup' }}/${{ inputs.task_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: One-time task UUID
        required: true
        type: string
      owner_tag:
        description: Opaque task owner tag
        required: true
        type: string
      config_gzip:
        description: Compressed configuration generated by the website backend
        required: true
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted firmware source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare temporary configuration
        id: target
        env:
          TASK_ID: ${{ inputs.task_id }}
          OWNER_TAG: ${{ inputs.owner_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OWNER_TAG" =~ ^[A-Za-z0-9_-]{16}$ ]]
          python3 python/web_build.py prepare --task-id "$TASK_ID"

      - name: Install Arm GNU Toolchain 14.2.Rel1
        shell: bash
        run: |
          set -euo pipefail
          archive='arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz'
          toolchain="$RUNNER_TEMP/hc32-gcc"
          curl --fail --location --retry 3 \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  %s\n' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$toolchain"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$toolchain" --strip-components=1
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"

      - name: Build firmware
        env:
          KEYBOARD: ${{ steps.target.outputs.keyboard }}
        shell: bash
        run: |
          set -euo pipefail
          make -C "keyboard/$KEYBOARD" all TARGET="$KEYBOARD" PREFIX=arm-none-eabi- -j2

      - name: Collect HEX and BIN
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: python3 python/web_build.py collect --task-id "$TASK_ID"

      - name: Upload temporary firmware
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-${{ inputs.task_id }}
          path: .web-output/${{ inputs.task_id }}/firmware.*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Remove temporary configuration
        if: always()
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: python3 python/web_build.py cleanup --task-id "$TASK_ID"

  cleanup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Remove completed web builds older than two hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/workflows/web-build.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select((.created_at | fromdateiso8601) < (now - 7200)) | .id' |
          while read -r run_id; do
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"
          done
